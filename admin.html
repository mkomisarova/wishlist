<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Wishlist</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="page-header">
  <h1>Manage Wishlist</h1>
  <p><a href="index.html">← back to the wishlist</a></p>
</header>

<div class="admin-wrap">

  <!-- Sign in -->
  <div class="admin-card" id="signin-card">
    <h2>Sign in</h2>
    <form id="signin-form">
      <div class="field">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="primary">Sign in</button>
      <div id="signin-msg"></div>
    </form>
  </div>

  <!-- Admin panel (hidden until signed in) -->
  <div id="admin-panel" class="hidden">
    <div id="auth-status"></div>

    <div class="admin-card">
      <h2 id="form-title">Add an item</h2>
      <form id="item-form">
        <div class="field">
          <label for="item-name">Name</label>
          <input type="text" id="item-name" required />
        </div>
        <div class="field">
          <label for="item-description">Description</label>
          <textarea id="item-description"></textarea>
        </div>
        <div class="price-row">
          <div class="field">
            <label for="item-price-min">Price (or low end of range)</label>
            <input type="number" id="item-price-min" min="0" step="0.01" required />
          </div>
          <div class="field">
            <label for="item-price-max">High end of range (optional)</label>
            <input type="number" id="item-price-max" min="0" step="0.01" />
          </div>
        </div>
        <div class="field">
          <label for="item-category">Category</label>
          <input type="text" id="item-category" list="category-list" placeholder="e.g. Makeup, Lego, Books" />
          <datalist id="category-list"></datalist>
        </div>
        <div class="field">
          <label for="item-link">Link (optional)</label>
          <input type="url" id="item-link" placeholder="https://..." />
        </div>
        <div class="field">
          <label>How many would make you happy?</label>
          <div class="radio-row">
            <label><input type="radio" name="quantityType" value="single" checked /> Just one</label>
            <label><input type="radio" name="quantityType" value="multiple" /> As many as people want to get</label>
          </div>
        </div>
        <div class="field">
          <label for="item-image">Photo</label>
          <input type="file" id="item-image" accept="image/*" />
          <img id="image-preview" class="hidden" style="width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:6px;" />
        </div>
        <button type="submit" class="primary" id="submit-btn">Add item</button>
        <button type="button" class="secondary hidden" id="cancel-edit-btn">Cancel edit</button>
        <div id="form-msg"></div>
      </form>
    </div>

    <div class="admin-card">
      <h2>Existing items</h2>
      <div id="items-list"></div>
    </div>
  </div>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
